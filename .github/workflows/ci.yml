name: GPO Enterprise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        cd src-backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src-backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run Backend Tests
      env:
       PYTHONPATH: .
      run: |
       cd src-backend
       pytest tests/ 

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install Dependencies
      run: |
        cd src-frontend
        npm ci
    - name: Build Frontend
      run: |
        cd src-frontend
        npm run build
